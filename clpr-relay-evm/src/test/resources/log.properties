# Swirlds logging configuration for clpr-relay-evm unit tests.
#
# DefaultLoggingSystem (swirlds-logging) resolves its config from the
# LOG_CONFIG_PATH environment variable. The Test task wires LOG_CONFIG_PATH to
# the absolute path of this file (see build.gradle.kts). Without it, the logging
# system retry-waits ~10s for a non-existent config path on first logger init
# (e.g. EvmTransactionSubmitter's static logger), inflating test runtime.

# Levels (least to most verbose): OFF, ERROR, WARN, INFO, DEBUG, TRACE.
logging.level=INFO
logging.level.org.hiero.clpr.relay=DEBUG

logging.handler.console.type=console
logging.handler.console.enabled=true
logging.handler.console.formatTimestamp=true
logging.handler.console.inheritLevels=true
