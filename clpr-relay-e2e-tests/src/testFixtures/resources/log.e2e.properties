# Swirlds logging configuration for the relay INSIDE the E2E endpoint container.
#
# Staged to /app/log.properties by :clpr-relay-e2e-tests:stageEndpointImage. The
# relay's working directory is /app, so DefaultLoggingSystem picks this up without
# LOG_CONFIG_PATH. It MUST exist — swirlds-logging's FileSystemUtils blocks waiting
# for the path when it is missing.
#
# Levels (least to most verbose): OFF, ERROR, WARN, INFO, DEBUG, TRACE.

# --- Levels ---------------------------------------------------------------
# Root at INFO: third-party (Helidon, gRPC, Netty) chatter stays out of the way.
logging.level=INFO

# Relay code at DEBUG. The E2E assertions read these logs (LogStream) for
# "no ERROR-level messages" and nonce-collision detection, so the relay's own
# lifecycle and per-cycle decisions must be visible.
logging.level.org.hiero.clpr.relay=DEBUG

# The sync and submit paths are what E2E tests actually diagnose. TRACE here is
# affordable because a test runs for minutes, not days — and a stalled channel is
# nearly impossible to diagnose from INFO alone.
logging.level.org.hiero.clpr.relay.sync=TRACE
logging.level.org.hiero.clpr.relay.evm.AccountTransactionSubmitter=TRACE

# --- Console handler ------------------------------------------------------
# Container stdout is the transport: Testcontainers captures it and LogStream
# asserts over it. "console-immediate" flushes per event so a crash or a SIGKILL
# (EvmEndpoint.kill()) cannot swallow the last lines — which are exactly the ones
# that explain the failure.
logging.handler.console.type=console-immediate
logging.handler.console.enabled=true
logging.handler.console.formatTimestamp=true
logging.handler.console.inheritLevels=true
