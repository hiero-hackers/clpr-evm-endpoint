# Swirlds logging configuration for integration tests.
#
# DefaultLoggingSystem (swirlds-logging) resolves its config from the
# LOG_CONFIG_PATH environment variable (or `log.properties` relative to the
# JVM's CWD when unset). The Test task wires LOG_CONFIG_PATH to the absolute
# path of this file (see build.gradle.kts) — a classpath resource is NOT
# consulted, so referencing it by path is required. Pointing at a real file
# also silences the per-cycle "Unable to load logging configuration" warning.
#
# Levels (least to most verbose): OFF, ERROR, WARN, INFO, DEBUG, TRACE.

# --- Levels ---------------------------------------------------------------
# Root stays INFO so Testcontainers / third-party libs aren't flooded.
logging.level=INFO

# Relay code at DEBUG for granular integration-test visibility. Raise an
# individual sub-package to TRACE when chasing a specific subsystem, e.g.:
#   logging.level.org.hiero.clpr.relay.sync=TRACE
logging.level.org.hiero.clpr.relay=DEBUG

# --- Console handler ------------------------------------------------------
# "console-immediate" (org.hiero.clpr.relay.core.ImmediateConsoleHandler, provided
# by clpr-relay-core so every module's test JVM can resolve it) flushes on every
# event, so output isn't lost or truncated when a test fails mid-run or the forked
# test JVM exits — unlike swirlds-logging's buffered built-in "console".
logging.handler.console.type=console-immediate
logging.handler.console.enabled=true
logging.handler.console.formatTimestamp=true
logging.handler.console.inheritLevels=true
