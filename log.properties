#
# Swirlds logging configuration (com.swirlds.logging).
# Loaded from the working directory by default, or from the path in the
# LOG_CONFIG_PATH environment variable. Reloaded periodically at runtime
# (see logging.reloadConfigPeriod below), so level changes can take effect
# without restarting the relay.
#
# Levels (least to most verbose): OFF, ERROR, WARN, INFO, DEBUG, TRACE.

# --- Levels ---------------------------------------------------------------

# Root level applied to anything not matched by a more specific entry below.
logging.level=INFO

# Relay code — keep at INFO in normal operation. Raise individual sub-packages
# to DEBUG when investigating a specific subsystem, e.g.:
#   logging.level.org.hiero.clpr.relay.evm=DEBUG
#   logging.level.org.hiero.clpr.relay.sync=DEBUG
logging.level.org.hiero.clpr.relay=INFO

# How often the file is re-read for level changes.
logging.reloadConfigPeriod=30s

# --- Console handler ------------------------------------------------------
# Uses the relay's "console-immediate" handler (org.hiero.clpr.relay.core.ImmediateConsoleHandler)
# instead of swirlds-logging's built-in "console" — the built-in buffers stdout with an 8 KB
# buffer flushed every 1 s, which is fine for production but hides startup output during
# interactive runs under Gradle. "console-immediate" flushes on every event.

logging.handler.console.type=console-immediate
logging.handler.console.enabled=true
logging.handler.console.formatTimestamp=true
logging.handler.console.inheritLevels=true
